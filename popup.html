<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glow para RosarioGarage</title>
  <style>
    :root { color-scheme: dark; --bg: #1b1b1b; --fg: #f2f2f2; --muted: #a8a8a8; --accent: #ff8a1f; }
    body { margin: 0; width: 300px; padding: 14px 16px 12px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
    h1 { margin: 0 0 2px; font-size: 15px; }
    p { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
    label { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; cursor: pointer; }
    input { accent-color: var(--accent); margin-top: 3px; }
    small { display: block; color: var(--muted); font-size: 12px; }
    footer { margin-top: 10px; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <h1>Glow para RosarioGarage</h1>
  <p>Extensión no oficial. Los cambios se aplican al instante.</p>
  <div id="list"></div>
  <footer>No es un producto de RosarioGarage.com.</footer>
  <script src="popup.js"></script>
</body>
</html>
